<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Virtual Mall</title>
<style>
:root{
  --ink:#1B1712;--sand:#E8DAC0;--paper:#F6EFE3;--card:#FFFDF8;
  --gold:#C79A2E;--gold2:#E4C46A;--brick:#8C4A2F;--green:#3E9B5F;--amber:#D08A1E;
  --muted:#8C8069;--line:rgba(27,23,18,.15);--sh:0 14px 34px -16px rgba(27,23,18,.45);
  --f:"IBM Plex Sans Arabic","Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:#F6EFE3;width:100%;min-height:100%}
body{width:100%;min-width:100%;max-width:100%;min-height:100vh;margin:0;background:var(--paper);
  color:var(--ink);font-family:var(--f);line-height:1.6;overflow-x:hidden;padding-bottom:64px}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font-family:inherit;font-size:inherit}
button{cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
img{max-width:100%}
.hide{display:none!important}

.nav{position:sticky;top:0;z-index:30;background:var(--ink);color:var(--sand);
  display:flex;align-items:center;gap:10px;padding:10px 14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px}
.nav .links{display:none;gap:4px}
/* التنقل في الشريط السفلي فقط */
.nav .links button{padding:7px 13px;border-radius:999px;font-size:13.5px;color:#C7BBA2}
.nav .links button.on{background:rgba(232,218,192,.14);color:var(--sand)}
.nav .sp{flex:1}
.nbtn{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:7px 12px;border-radius:999px;
  border:1px solid rgba(232,218,192,.22)}
.nbtn.on{background:var(--gold);color:#241D12;border-color:var(--gold);font-weight:600}
.badge{background:var(--brick);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;
  display:inline-grid;place-items:center;padding:0 5px;font-weight:600}
.tabbar{position:fixed;bottom:0;inset-inline:0;z-index:30;background:var(--ink);display:flex;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));border-top:1px solid #000}
.tabbar{padding-bottom:env(safe-area-inset-bottom,0px)}
@media(min-width:861px){.tabbar{justify-content:center}.tabbar button{flex:0 1 120px;font-size:12px}}
.tabbar button{flex:1;color:#8C8069;font-size:10.5px;display:grid;gap:2px;justify-items:center;padding:5px 0}
.tabbar button.on{color:var(--gold2)}
.tabbar button{position:relative;min-width:0}
.tabbar .tbadge{position:absolute;top:2px;inset-inline-start:calc(50% + 4px);font-style:normal;background:var(--brick);color:#fff;
  font-size:9.5px;min-width:16px;height:16px;line-height:16px;border-radius:8px;padding:0 4px}
.tabbar .tbadge[hidden]{display:none}
/* أزرار شريط العنوان: أيقونات فقط على الشاشات الضيقة */
.nav .nbtn .ic{font-size:15px;line-height:1}
@media(max-width:640px){.nav .nbtn .tx{display:none}.nav .nbtn{padding:7px 9px}.nav .logo span{font-size:14px}.nav{gap:6px}}
#aiBtn{background:linear-gradient(135deg,#C79A2E,#E4C46A);color:#241D12;border-color:#C79A2E;font-weight:700}
.tabbar i{font-style:normal;font-size:18px;line-height:1}

.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.screen{display:none;padding-bottom:36px}
.screen.on{display:block}
.sec{margin-top:32px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:13px}
.sec-h h2{margin:0;font-size:19px;font-weight:600}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-align:start;
  display:flex;flex-direction:column}
.tile .ph{aspect-ratio:4/3;background:var(--sand);display:grid;place-items:center;overflow:hidden;font-size:26px}
.tile .ph img{width:100%;height:100%;object-fit:cover;display:block}
.tile .bd{padding:10px 12px}
.tile h3{margin:0;font-size:14px;font-weight:600}
.tile p{margin:3px 0 0;font-size:11.5px;color:var(--muted)}
.price{font-size:14px;font-weight:600;color:var(--brick);margin-top:6px}
.price s{font-size:11.5px;color:var(--muted);font-weight:400;margin-inline-start:6px}
.empty{border:1px dashed var(--line);border-radius:16px;padding:24px 18px;text-align:center;
  color:var(--muted);font-size:13px;background:rgba(255,253,248,.6)}
.empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:5px;font-weight:600}
.empty button{margin-top:12px}
.btn{display:inline-block;padding:11px 20px;border-radius:999px;font-size:13.5px;font-weight:600;
  background:var(--ink);color:var(--sand);text-align:center}
.btn.gold{background:var(--gold);color:#241D12}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:8px 14px;font-size:12.5px}
.btn.wide{width:100%}
.row{display:flex;gap:9px;flex-wrap:wrap}

.hero{background:linear-gradient(160deg,#1B1712,#2E2519 60%,#3A2E1C);color:var(--sand);
  padding:42px 0 44px;position:relative;overflow:hidden}
.hero .wrap{position:relative;z-index:2}
.hero h1{margin:0 0 12px;font-size:29px;line-height:1.3;font-weight:600;max-width:15ch}
@media(min-width:700px){.hero h1{font-size:40px}}
.hero p{margin:0 0 20px;font-size:14.5px;color:#C7BBA2;max-width:46ch;line-height:1.8}
.hero .pat{position:absolute;inset-inline-end:-60px;top:-40px;width:320px;height:320px;opacity:.13}
.stats{display:flex;gap:22px;margin-top:24px;flex-wrap:wrap}
.stats b{display:block;font-size:22px;color:var(--gold2);font-weight:600}
.stats span{font-size:11.5px;color:#A79B84}

/* ===== خريطة OpenStreetMap ===== */
.mapbox{position:relative;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#DDD8CC;
  height:clamp(320px,58vh,560px)}
#mapHost{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;background:#DDD8CC}
#mapHost.drag{cursor:grabbing}
#mapHost.pick{cursor:crosshair}
.tiles img{position:absolute;width:256px;height:256px;pointer-events:none;user-select:none;
  -webkit-user-drag:none}
#basemapImg{position:absolute;display:none;pointer-events:none;user-select:none;-webkit-user-drag:none;
  max-width:none!important;max-height:none!important;
  image-rendering:auto;z-index:1}
#basemapImg.on{display:block}
.cov{position:absolute;inset:0;pointer-events:none;z-index:2}
.mk{position:absolute;transform:translate(-50%,-100%);z-index:3;cursor:pointer;padding:0;line-height:1}
.mk.dot{transform:translate(-50%,-50%);width:34px;height:34px;display:grid;place-items:center;
  background:transparent;border-radius:50%}
.mk.dot:hover{z-index:5}
.dot-i{width:17px;height:17px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.mkn{position:absolute;top:-2px;inset-inline-end:-2px;background:#1B1712;color:#E4C46A;font-size:10px;
  min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 3px;font-weight:600}
.pin{width:26px;height:34px;display:grid;place-items:center;font-size:14px;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.osmattr{position:absolute;inset-inline-end:0;bottom:0;background:rgba(255,255,255,.82);font-size:10px;
  padding:1px 7px;z-index:6;color:#333;border-radius:6px 0 0 0}
.osmattr a{color:#333}
.mapctl{position:absolute;inset-inline-end:12px;top:12px;display:grid;gap:7px;z-index:5}
.mapctl button{width:36px;height:36px;border-radius:10px;background:var(--paper);border:1px solid var(--line);
  display:grid;place-items:center;font-size:15px;box-shadow:var(--sh)}
.maplegend{position:absolute;inset-inline-start:12px;bottom:22px;background:rgba(246,239,227,.94);
  border:1px solid var(--line);border-radius:12px;padding:8px 11px;font-size:11.5px;z-index:5;line-height:1.9}
.maplegend i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-inline-end:6px}
.mapwarn{position:absolute;inset-inline-start:12px;inset-inline-end:58px;top:12px;z-index:7;
  background:rgba(140,74,47,.95);color:#fff;font-size:12px;padding:8px 12px;border-radius:10px;
  line-height:1.6;pointer-events:none}
.pickbar{position:absolute;inset-inline:12px;bottom:12px;z-index:7;background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px;display:flex;
  gap:9px;align-items:center;flex-wrap:wrap;box-shadow:var(--sh)}
.popcard{position:absolute;inset-inline-start:12px;bottom:46px;background:var(--card);
  border:1px solid var(--line);border-radius:16px;padding:14px;z-index:8;box-shadow:var(--sh);max-width:300px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}
.chip{font-size:12.5px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card)}
.chip.on{background:var(--ink);color:var(--sand);border-color:var(--ink)}
.searchbar{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:10px 16px;margin-top:14px}
.searchbar input{flex:1;border:0;background:none;outline:none;font-size:13.5px}

/* ===== عارض الجولة ===== */
.ov{position:fixed;inset:0;z-index:50;background:#0B0A09;display:none}
.ov.on{display:block}
.stage{position:absolute;inset:0;background:#000;overflow:hidden}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;
  transition:opacity .3s ease}
.stage img.show{opacity:1}
.ovtop{position:absolute;top:0;inset-inline:0;padding:12px 14px;display:flex;gap:11px;align-items:center;
  background:linear-gradient(to bottom,rgba(11,10,9,.85),transparent);color:var(--sand);z-index:6}
.ovtop h2{margin:0;font-size:15px}
.ovtop p{margin:0;font-size:11.5px;color:#B5A88F}
.ico{width:36px;height:36px;border-radius:50%;background:rgba(246,239,227,.16);display:grid;place-items:center;
  color:var(--sand);flex:0 0 36px;font-size:16px}
/* أسهم شفافة فوق الصورة */
.arrow{position:absolute;z-index:5;width:56px;height:56px;border-radius:50%;
  background:rgba(246,239,227,.18);border:1.5px solid rgba(246,239,227,.45);color:#fff;
  display:grid;place-items:center;font-size:21px;transition:background .15s}
.arrow:hover{background:rgba(199,154,46,.7);border-color:var(--gold)}
.arrow b{font-weight:400;line-height:1}
.arrow small{position:absolute;top:58px;font-size:10px;color:#E8DAC0;white-space:nowrap;
  text-shadow:0 1px 3px #000}
.arrow.bwd small{top:auto;bottom:58px}
.arrow.fwd{top:32%;left:50%;transform:translate(-50%,-50%)}
.arrow.bwd{bottom:130px;left:50%;transform:translateX(-50%)}
.arrow.lft{left:16px;top:50%;transform:translateY(-50%)}
.arrow.rgt{right:16px;top:50%;transform:translateY(-50%)}
.arrow.lft small,.arrow.rgt small{top:60px;left:50%;transform:translateX(-50%)}
.ovbot{position:absolute;bottom:0;inset-inline:0;padding:14px 14px 18px;z-index:6;text-align:center;
  background:linear-gradient(to top,rgba(11,10,9,.9),transparent)}
.dirbar{display:inline-flex;gap:6px;background:rgba(27,23,18,.6);border-radius:999px;padding:5px}
.dirbar button{padding:7px 14px;border-radius:999px;font-size:12.5px;color:#D9CDB4}
.dirbar button.on{background:var(--gold);color:#241D12;font-weight:600}
.dirbar button.off{opacity:.3}
.seqline{color:#B5A88F;font-size:11.5px;margin-top:8px}
.seqline b{color:var(--gold2);font-size:13px}
.svmini{position:absolute;inset-inline-end:14px;top:64px;width:150px;background:rgba(246,239,227,.95);
  border-radius:12px;padding:7px;z-index:6;box-shadow:var(--sh)}
.svmini svg{width:100%;height:92px;display:block;border-radius:8px;background:#DDD8CC}
.svmini span{display:block;font-size:10.5px;color:var(--muted);text-align:center;margin-top:3px}
@media(max-width:520px){.svmini{width:116px;top:58px}.svmini svg{height:72px}}
.nearwrap{position:absolute;inset-inline-start:14px;bottom:110px;z-index:6;display:grid;gap:7px;max-width:230px}
.nearcard{display:flex;align-items:center;gap:9px;background:rgba(246,239,227,.95);border-radius:12px;
  padding:8px 11px;text-align:start;width:100%;font-size:12.5px}
.nearcard h4{margin:0;font-size:12.5px}
.nearcard span:last-child{margin-inline-start:auto;color:var(--brick);font-weight:600}

.storeview{position:absolute;inset:0;background:var(--paper);display:flex;flex-direction:column}
.svtop{display:flex;align-items:center;gap:11px;padding:11px 14px;border-bottom:1px solid var(--line)}
.svtop .ico{background:var(--sand);color:var(--ink)}
.svbody{flex:1;min-height:0;overflow-y:auto;padding:14px}
.shot{position:relative;border-radius:16px;overflow:hidden;background:#cfc4ad}
.shot img{width:100%;height:auto;display:block}
.hs{position:absolute;width:34px;height:34px;margin:-17px;border-radius:50%;background:rgba(246,239,227,.95);
  box-shadow:0 3px 12px rgba(0,0,0,.4);display:grid;place-items:center}
.hs::after{content:none}
.hs{width:auto;height:auto;margin:0;background:none!important;box-shadow:none;transform:translate(-50%,-50%);border:0;padding:0}
.pcirc{width:50px;height:50px;border-radius:50%;background:#3E9B5F;color:#fff;display:grid;place-content:center;text-align:center;
  border:2px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.35);line-height:1.15;font-family:inherit}
.pcirc b{font-size:10.5px;font-weight:700;white-space:nowrap}
.pcirc small{font-size:9px;font-weight:600;white-space:nowrap;opacity:.95}
.pcirc.warn{background:#A33A2F}
.pcirc.long{width:58px;height:58px}.pcirc.long b{font-size:9px}.pcirc.long small{font-size:8px}
.pcirc.corner{position:absolute;top:8px;inset-inline-start:8px;width:46px;height:46px}
.pcirc.corner.long{width:58px;height:58px}
.tile .ph{position:relative}
.hs:hover .pcirc{transform:scale(1.08)}
.hs:hover{background:var(--gold)}
.thumbs{display:flex;gap:8px;overflow-x:auto;margin-top:10px}
.thumbs button{width:88px;height:56px;border-radius:9px;overflow:hidden;border:2px solid transparent;flex:0 0 auto}
.thumbs button.on{border-color:var(--gold)}
.thumbs img{width:100%;height:100%;object-fit:cover}

.sheet{position:fixed;z-index:60;inset-inline-start:0;top:0;height:100vh;height:100dvh;height:var(--vvh,100dvh);width:min(410px,100%);
  background:var(--paper);display:flex;flex-direction:column;transform:translateX(100%);
  transition:transform .3s,visibility 0s linear .3s;box-shadow:-18px 0 44px -22px rgba(0,0,0,.6);visibility:hidden}
.sheet.on{visibility:visible;transition:transform .3s,visibility 0s}
html[dir=ltr] .sheet{transform:translateX(-100%)}
.sheet.on,html[dir=ltr] .sheet.on{transform:none}
@media(max-width:860px){.sheet{width:100%;height:90vh;height:90dvh;height:calc(var(--vvh,100dvh)*.9);top:auto;bottom:var(--kb,0px);border-radius:20px 20px 0 0;
  transform:translateY(100%)}html[dir=ltr] .sheet{transform:translateY(100%)}
  .sheet.on,html[dir=ltr] .sheet.on{transform:none}}
.sh-h{display:flex;align-items:center;gap:10px;padding:14px;border-bottom:1px solid var(--line)}
.sh-h h2{margin:0;font-size:15.5px}
.sh-b{flex:1;min-height:0;overflow-y:auto;padding:16px}
.sh-f{padding:13px 16px;border-top:1px solid var(--line)}
.scrim{position:fixed;inset:0;background:rgba(20,17,13,.5);z-index:55;opacity:0;pointer-events:none;transition:.25s}
.scrim.on{opacity:1;pointer-events:auto}

.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);
  border-radius:10px;background:var(--card);font-size:13.5px}
.field textarea{min-height:70px;resize:vertical}
.field.bad input,.field.bad select{border-color:var(--brick)}
.field .err{color:var(--brick);font-size:11.5px;margin:4px 0 0;display:none}
.field.bad .err{display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.up{border:1px dashed var(--line);border-radius:12px;padding:11px;text-align:center;background:var(--card);
  margin-bottom:8px}
.up .lb.cam{margin-top:8px;padding:10px;font-size:12.5px}
.up input{display:none}
.up .lb{font-size:12.5px;color:var(--muted);cursor:pointer;display:block}
.dirblock{border:1px solid var(--line);border-radius:14px;padding:11px;margin-bottom:11px;background:var(--card)}
.dirblock h4{margin:0 0 8px;font-size:13px;display:flex;align-items:center;gap:7px}
.dirblock h4 span{margin-inline-start:auto;font-size:11px;color:var(--muted);font-weight:400}
.phgrid{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;align-items:center}
.phcell{position:relative;width:74px;height:56px;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.phcell img{width:100%;height:100%;object-fit:cover;display:block}
.phnum{position:absolute;bottom:2px;inset-inline-start:3px;font-size:10px;color:#fff;
  background:rgba(0,0,0,.6);border-radius:6px;padding:0 5px}
.phrm{position:absolute;top:2px;inset-inline-end:2px;width:19px;height:19px;border-radius:50%;
  background:rgba(140,74,47,.92);color:#fff;font-size:11px;line-height:1;padding:0}
.locrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:12px;font-size:12.5px;
  color:var(--muted)}
.locok{color:var(--green);font-weight:600}
.atabs{display:flex;gap:6px;overflow-x:auto;padding:14px 0 4px}
.atabs button{padding:8px 14px;border-radius:999px;font-size:12.5px;border:1px solid var(--line);
  background:var(--card);white-space:nowrap}
.atabs button.on{background:var(--ink);color:var(--sand);border-color:var(--ink)}
.panelbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
.panelbox h3{margin:0 0 12px;font-size:15px}
.list{display:grid;gap:8px;margin-top:12px}
.item{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;
  background:var(--paper);font-size:13px}
.item .g{margin-inline-start:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.item small{color:var(--muted);font-size:11px;display:block}
.pill{font-size:10.5px;padding:3px 9px;border-radius:999px;font-weight:600}
.pill.pending{background:#F6E6C8;color:#7A5410}
.pill.pub{background:#DFF0E4;color:#215E36}
.mini{font-size:11.5px;padding:6px 11px;border-radius:999px;border:1px solid var(--line)}
.mini.d{color:var(--brick);border-color:rgba(140,74,47,.4)}
.mini.p{background:var(--green);color:#fff;border-color:var(--green)}
.stats2{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.stats2 div{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:11px}
.stats2 b{display:block;font-size:20px;color:var(--brick);font-weight:600}
.stats2 span{font-size:11px;color:var(--muted)}
.sizerow{display:flex;gap:8px;margin-bottom:7px;align-items:center}
.sizerow input{flex:1;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
.toast{position:fixed;bottom:78px;inset-inline-start:50%;transform:translateX(50%) translateY(14px);
  background:var(--ink);color:var(--sand);padding:11px 19px;border-radius:999px;font-size:13px;z-index:90;
  opacity:0;pointer-events:none;transition:.22s;max-width:86vw;text-align:center}
html[dir=ltr] .toast{transform:translateX(-50%) translateY(14px)}
.toast.on{opacity:1;transform:translateX(50%) translateY(0)}
html[dir=ltr] .toast.on{transform:translateX(-50%) translateY(0)}
.sizes{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.size{min-width:46px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);
  font-size:13px;font-weight:600}
.size.on{background:var(--ink);color:var(--sand)}
.size[disabled]{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.size small{display:block;font-size:9.5px;font-weight:400;color:var(--muted)}
.citem{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}

/* شاشة الخطأ للفشل في الإقلاع فقط. بعد الإقلاع تُسجَّل الأخطاء العابرة دون إخفاء التطبيق:
   كود المنصة الذي يعمل داخل الصفحة قد يرمي أخطاء لا تخص التطبيق ولا تضرّه. */
window.__vmBooted=false;window.__vmErrors=[];
window.onerror=function(m,s,l){
  window.__vmErrors.push(String(m)+" ("+l+")");
  if(window.__vmBooted){try{console.warn("[VirtualMall] non-fatal:",m,s,l);}catch(e){}return true;}
  var b=document.getElementById("bootfail");
  if(b){b.style.display="grid";document.getElementById("bootmsg").textContent=m+" ("+l+")";}return false;};
window.addEventListener("unhandledrejection",function(e){
  window.__vmErrors.push("rejection: "+(e&&e.reason&&(e.reason.message||e.reason.code)||e.reason));
  if(window.__vmBooted)try{e.preventDefault();}catch(err){}
});
</script>

const COLLS=["cities","areas","streets","points","stores","storeImages","products","hotspots","brands"];
const CATALOG=new Set(COLLS);
/* بيانات الزبائن: مساحات منفصلة تسمح بها القواعد دون المساس بالكتالوج */
let SOLD={},RATINGS={},MYORDERS=[],FAVS=[],CUSTOMER=null,STATS={},MYSTATS={p:{},s:{}};
/* قواعد الحماية المعلنة عند النشر (للتوثيق والاختبار) */

const CLOUD={db:null,assets:null,user:null,canEdit:true,online:false,busy:0,err:false,subs:[]};
const MAXDOC=200000;   /* الحد الآمن لحجم المستند */

function cloudStatus(){
  if(!CLOUD.online)return {k:"cloudOff",c:"#8C4A2F"};
  if(CLOUD.err)return {k:"cloudErr",c:"#8C4A2F"};
  if(CLOUD.busy>0)return {k:"cloudSaving",c:"#D08A1E"};
  return {k:"cloudOn",c:"#3E9B5F"};
}
function saveDoc(coll,obj){
  if(!CLOUD.online||!obj||!obj.id)return Promise.resolve();
  if(CATALOG.has(coll)&&!CLOUD.canEdit)return Promise.resolve();
  let body;
  try{body=JSON.parse(JSON.stringify(obj));}catch(e){return Promise.resolve();}
  if(JSON.stringify(body).length>MAXDOC){CLOUD.err=true;toast(t("cloudErr"));return Promise.resolve();}
  CLOUD.busy++;renderCloudBadge();
  return CLOUD.db.doc(coll+"/"+obj.id).set(body)
    .then(function(){CLOUD.err=false;})
    .catch(function(){CLOUD.err=true;})
    .then(function(){CLOUD.busy--;renderCloudBadge();});
}
function delDoc(coll,id){
  if(!CLOUD.online||!id)return Promise.resolve();
  if(CATALOG.has(coll)&&!CLOUD.canEdit)return Promise.resolve();
  CLOUD.busy++;renderCloudBadge();
  return CLOUD.db.doc(coll+"/"+id).delete()
    .catch(function(){CLOUD.err=true;})
    .then(function(){CLOUD.busy--;renderCloudBadge();});

/* تحويل صورة base64 إلى ملف مخزَّن حقيقي عند توفر التخزين */
function dataUrlToBlob(u){
  const i=u.indexOf(","),head=u.slice(0,i),b64=u.slice(i+1);
  const mime=(head.match(/:(.*?);/)||[,"image/jpeg"])[1];
  const bin=atob(b64),arr=new Uint8Array(bin.length);
  for(let k=0;k<bin.length;k++)arr[k]=bin.charCodeAt(k);
  return new Blob([arr],{type:mime});
}
function uploadCode(e){return (e&&(e.code||e.name||e.message))||"upstream_error";}
function uploadWithRetry(blob){
  const waits=[0,900,2200,4500];
  function attempt(k){
    return new Promise(function(r){setTimeout(r,waits[k]);}).then(function(){
      return CLOUD.assets.upload(blob,{type:blob.type||"image/jpeg"});
    }).then(function(r){
      if(!r||!r.id)throw {code:"upstream_error"};
      return "/_blob/"+r.id;
    }).catch(function(e){
      const c=uploadCode(e);
      if(k<waits.length-1&&/rate_limited|store_unavailable|upstream_error|transform_error/.test(c))return attempt(k+1);
      throw {code:c};
    });
  }
  return attempt(0);
}
/* مع الخادم: تُرفع الصورة ملفاً ويُحفظ رابطها فقط. إن فشل الرفع لا نضع الصورة داخل المستند
   (سيتجاوز الحجم ويفشل الحفظ بصمت) بل نرفض برسالة واضحة. بلا خادم: تبقى محلياً. */
function finalizeImage(dataUrl){
  if(!CLOUD.assets||!/^data:/.test(dataUrl))return Promise.resolve(dataUrl);
  let blob;
  try{blob=dataUrlToBlob(dataUrl);}catch(e){return Promise.reject(new Error("notImage"));}
  return uploadWithRetry(blob).catch(function(e){
    const c=uploadCode(e);
    const err=new Error(/rate_limited|store_unavailable/.test(c)?"uploadRate":
      (/quota/.test(c)?"uploadQuota":(/auth|not_granted/.test(c)?"uploadAuth":"uploadFail")));
    err.code=c;throw err;
  });
}
/* معالجة الصور واحدة تلو الأخرى: ذاكرة أقل على الهاتف، ولا رفض من الخادم بسبب التزاحم */
let IMGQ=Promise.resolve();
function processImages(files,onOne,onDone){
  const list=Array.prototype.slice.call(files||[]);
  if(!list.length)return;
  let ok=0,bad=0;const reasons={};
  list.forEach(function(f,i){
    IMGQ=IMGQ.then(function(){
      if(list.length>1||CLOUD.assets)toast(t("uploadingN")+" "+(i+1)+" "+t("of")+" "+list.length);
      return readImage(f).then(function(r){return finalizeImage(r.url);})
        .then(function(u){ok++;onOne(u);})
        .catch(function(e){bad++;const k=(e&&e.message)||"notImage";reasons[k]=1;});
    }).then(function(){
      if(i<list.length-1)return;
      const keys=Object.keys(reasons);
      if(bad)toast((ok?t("photosSomeFailed")+" — ":"")+t(keys[0]&&STR[LANG][keys[0]]?keys[0]:"notImage"));
      else toast(t("photosAdded"));
      if(onDone)onDone(ok,bad);
    });
  });
}

/* المستندات القادمة من الخادم للقراءة فقط (مجمّدة)؛ ننسخها نسخة عميقة مستقلة قابلة للتعديل */
function cloneDoc(v){
  if(v==null)return {};
  try{return JSON.parse(JSON.stringify(v));}catch(e){return Object.assign({},v);}
}
function loadCollection(coll){
  return CLOUD.db.collection(coll).get().then(function(snap){
    const rows=[];
    snap.docs.forEach(function(d){
      if(!d.exists)return;
      const o=cloneDoc(d.data());o.id=d.id;rows.push(o);
    });
    if(rows.length)DB[coll]=rows;
  }).catch(function(){CLOUD.err=true;});
}
function subscribeCollection(coll){
  try{
    const un=CLOUD.db.collection(coll).onSnapshot(function(snap){
      const rows=[];
      snap.docs.forEach(function(d){if(!d.exists)return;const o=cloneDoc(d.data());o.id=d.id;rows.push(o);});
      DB[coll]=rows;
      if(coll==="points")normalizePoints();
      refreshScreen();
    },function(){CLOUD.err=true;renderCloudBadge();});
    CLOUD.subs.push(un);
  }catch(e){}
}
/* بيانات الزبائن: كل مجموعة تُقرأ بحسب ما تسمح به القواعد */
function readColl(coll){
  return CLOUD.db.collection(coll).get().then(function(snap){
    const out={};snap.docs.forEach(function(d){if(d.exists)out[d.id]=cloneDoc(d.data());});return out;
  }).catch(function(){return {};});
}
function applySold(m){SOLD={};Object.keys(m).forEach(function(k){SOLD[k]=Object.assign({},(m[k]||{}).sz||{});});}
function applyRatings(m){RATINGS={};Object.keys(m).forEach(function(k){RATINGS[k]=Object.assign({},(m[k]||{}).r||{});});
  if(CLOUD.userId&&RATINGS[CLOUD.userId])RATINGS[myId()]=RATINGS[CLOUD.userId];}
function applyOrders(m){
  const all=[];
  Object.keys(m).forEach(function(k){const d=m[k];
    if(d&&Array.isArray(d.list))d.list.forEach(function(o){all.push(o);});
    else if(d&&d.items)all.push(Object.assign({id:k},d,{__legacy:true,__doc:k}));        /* طلبات بالصيغة القديمة */
  });
  all.sort(function(a,b){return (a.at||0)-(b.at||0);});
  DB.orders=all;
}
function loadCustomerData(){
  const jobs=[readColl("sold").then(applySold),readColl("ratings").then(applyRatings)];
  if(CLOUD.canEdit){
    jobs.push(readColl("orders").then(function(m){applyOrders(m);
      if(CLOUD.userId&&m[CLOUD.userId]&&m[CLOUD.userId].list)MYORDERS=m[CLOUD.userId].list.slice();}));
    jobs.push(readColl("stats").then(function(m){STATS=m;}));
  }
  if(CLOUD.userId){
    if(!CLOUD.canEdit)jobs.push(CLOUD.db.doc("orders/"+CLOUD.userId).get().then(function(d){
      MYORDERS=(d&&d.exists&&cloneDoc(d.data()).list)||[];DB.orders=MYORDERS.slice();}).catch(function(){}));
    jobs.push(CLOUD.db.doc("stats/"+CLOUD.userId).get().then(function(d){
      if(d&&d.exists){const v=cloneDoc(d.data());MYSTATS={p:v.p||{},s:v.s||{}};}}).catch(function(){}));
    jobs.push(CLOUD.db.doc("data/users/"+CLOUD.userId+"/prefs").get().then(function(d){
      if(d&&d.exists){const v=cloneDoc(d.data());if(Array.isArray(v.favs))FAVS=v.favs.slice();
        if(v.customer&&typeof v.customer==="object")CUSTOMER=v.customer;}}).catch(function(){}));
  }
  return Promise.all(jobs);
}
function subscribeCustomerData(){
  const sub=function(coll,fn){try{CLOUD.subs.push(CLOUD.db.collection(coll).onSnapshot(function(snap){
    const out={};snap.docs.forEach(function(d){if(d.exists)out[d.id]=cloneDoc(d.data());});fn(out);refreshScreen();},
    function(){}));}catch(e){}};
  sub("sold",applySold);sub("ratings",applyRatings);
  if(CLOUD.canEdit){sub("orders",applyOrders);sub("stats",function(m){STATS=m;});}
}
function refreshScreen(){
  try{
    if(screen==="home")renderHome();
    else if(screen==="map"){renderMap();renderMapList();}
    else if(screen==="stores")renderStores();
    else if(screen==="admin")renderAdmin();
  }catch(e){}
}
function initCloud(){
  if(!(window.claude&&window.claude.use))return Promise.resolve();
  const grab=function(n){try{return window.claude.use(n).catch(function(){return null;});}
    catch(e){return Promise.resolve(null);}};
  return Promise.all([grab("db"),grab("assets"),grab("user")]).then(function(r){
    CLOUD.db=r[0];CLOUD.assets=r[1];CLOUD.user=r[2];
    const u=CLOUD.user;
    const role=u?Promise.all([
        u.isOwner?u.isOwner().catch(function(){return false;}):Promise.resolve(false),
        u.canEdit?u.canEdit().catch(function(){return false;}):Promise.resolve(false)
      ]).then(function(x){return x[0]||x[1];})
      :Promise.resolve(true);
    const uidP=(u&&u.id)?u.id().catch(function(){return null;}):Promise.resolve(null);
    return Promise.all([role,uidP]).then(function(rr){
      const can=rr[0];CLOUD.userId=rr[1]||null;
      CLOUD.canEdit=can;applyRole();buildNav();refreshScreen();
      if(!CLOUD.db)return;
      CLOUD.online=true;renderCloudBadge();
      return Promise.all(COLLS.map(loadCollection).concat([loadCustomerData()])).then(function(){
        normalizePoints();refreshScreen();renderCloudBadge();checkCaptureResume();
        COLLS.forEach(subscribeCollection);
        subscribeCustomerData();
      });
    });
  }).catch(function(){});
}

/* ---------- معالجة الصور ---------- */
const MIN_W=640,MAX_W=1600;
const IMG_EXT=/\.(jpe?g|png|webp|gif|bmp|heic|heif|avif)$/i;
function isHeic(f){return /hei[cf]/i.test((f&&f.type)||"")||/\.hei[cf]$/i.test((f&&f.name)||"");}
function validateImage(m){
  if(!m||!/^image\//.test(m.type||""))return {ok:false,reason:"notImage"};
  if(!m.width||!m.height)return {ok:false,reason:"notImage"};
  if(m.width<MIN_W&&m.height<MIN_W)return {ok:false,reason:"lowQuality"};
  return {ok:true};
}
function readImage(file){
  return new Promise(function(res,rej){
    if(!file){rej(new Error("notImage"));return;}
    /* بعض تطبيقات المعرض على أندرويد ترسل الملف بلا نوع: نعتمد على الامتداد أو نجرّب الفتح */
    const typed=/^image\//.test(file.type||"");
    const generic=!file.type||/octet-stream|binary/i.test(file.type);
    if(!typed&&!generic){rej(new Error("notImage"));return;}
    if(!typed&&file.name&&!IMG_EXT.test(file.name)&&/\.[a-z0-9]{2,5}$/i.test(file.name)){rej(new Error("notImage"));return;}
    let url;
    try{url=URL.createObjectURL(file);}catch(e){rej(new Error("notImage"));return;}
    const im=new Image();
    im.onerror=function(){URL.revokeObjectURL(url);rej(new Error(isHeic(file)?"heicImg":"notImage"));};
    im.onload=function(){
      const v=validateImage({type:typed?file.type:"image/jpeg",width:im.naturalWidth,height:im.naturalHeight});
      if(!v.ok){URL.revokeObjectURL(url);rej(new Error(v.reason));return;}
      try{
        const sc=Math.min(1,MAX_W/Math.max(im.naturalWidth,1));
        const w=Math.round(im.naturalWidth*sc),h=Math.round(im.naturalHeight*sc);
        const cv=document.createElement("canvas");cv.width=w;cv.height=h;
        const cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,w,h);cx.drawImage(im,0,0,w,h);
        const d=cv.toDataURL("image/jpeg",.82);
        URL.revokeObjectURL(url);cv.width=cv.height=0;
        res({url:d,w:w,h:h});
      }catch(e){URL.revokeObjectURL(url);rej(new Error("notImage"));}
    };
    im.src=url;
  });
}

/* ==========================================================================
   خريطة OpenStreetMap — بلاطات مباشرة من tile.openstreetmap.org
   ========================================================================== */
const TILE=256;
const MAPV={lat:33.3152,lng:44.3661,z:13};   /* بغداد */
let pickMode=null,tileErrors=0,tilesOK=0;
const lng2x=(lng,z)=>(lng+180)/360*Math.pow(2,z);
const lat2y=(lat,z)=>{const r=lat*Math.PI/180;
  return (1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*Math.pow(2,z);};
const x2lng=(x,z)=>x/Math.pow(2,z)*360-180;
const y2lat=(y,z)=>{const n=Math.PI-2*Math.PI*y/Math.pow(2,z);
  return 180/Math.PI*Math.atan(0.5*(Math.exp(n)-Math.exp(-n)));};
function mapSize(){const h=$("#mapHost");
  const r=h.getBoundingClientRect?h.getBoundingClientRect():{width:0,height:0};
  return {w:r.width||h.clientWidth||600,h:r.height||h.clientHeight||400};}
function topLeftPx(){
  const s=mapSize();
  return {x:lng2x(MAPV.lng,MAPV.z)*TILE-s.w/2,y:lat2y(MAPV.lat,MAPV.z)*TILE-s.h/2,w:s.w,h:s.h};
}
function project(lat,lng){
  const tl=topLeftPx();
  return {x:lng2x(lng,MAPV.z)*TILE-tl.x,y:lat2y(lat,MAPV.z)*TILE-tl.y};
}
function unproject(px,py){
  const tl=topLeftPx();
  return {lat:y2lat((tl.y+py)/TILE,MAPV.z),lng:x2lng((tl.x+px)/TILE,MAPV.z)};
}
/* يقرأ الإحداثيات من: نص "lat,lng" أو رابط OpenStreetMap أو Google Maps */
function parseLocText(txt){
  if(!txt)return null;
  const s=String(txt).trim();
  /* دبوس العلامة أدق من مركز العرض، فله الأولوية */
  let m=s.match(/[?&]mlat=(-?\d+(?:\.\d+)?)[&#].*?mlon=(-?\d+(?:\.\d+)?)/)||
        s.match(/[?&]mlat=(-?\d+(?:\.\d+)?)&mlon=(-?\d+(?:\.\d+)?)/);
  if(m){
    const zm=s.match(/#map=(\d+(?:\.\d+)?)\//);
    return {lat:+m[1],lng:+m[2],z:zm?Math.round(+zm[1]):null};
  }
  m=s.match(/#map=(\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)/);
  if(m)return {lat:+m[2],lng:+m[3],z:Math.round(+m[1])};
  m=s.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)(?:,(\d+(?:\.\d+)?)z)?/);
  if(m)return {lat:+m[1],lng:+m[2],z:m[3]?Math.round(+m[3]):null};
  m=s.match(/[?&]q=(-?\d+(?:\.\d+)?)[,\s]+(-?\d+(?:\.\d+)?)/);
  if(m)return {lat:+m[1],lng:+m[2]};
  m=s.match(/(-?\d{1,2}(?:\.\d+)?)\s*[,\s]\s*(-?\d{1,3}(?:\.\d+)?)/);
  if(m){
    const la=+m[1],ln=+m[2];
    if(la>=-90&&la<=90&&ln>=-180&&ln<=180)return {lat:la,lng:ln};
  }
  return null;
}
/* ===== خريطة الأساس: صورة مرفوعة مُعايَرة بنقطتين =====
   لكل صورة نقطتان معروفتان (كسر من عرض/ارتفاع الصورة + إحداثيات).
   منهما نشتق مقياس الصورة في إحداثيات ميركاتور، فتتموضع مع كل النقاط بدقة. */
const ZREF=20;
const wX=lng=>lng2x(lng,ZREF)*TILE;
const wY=lat=>lat2y(lat,ZREF)*TILE;
function bmSolve(bm){
  if(!bm||!bm.p1||!bm.p2)return null;
  const ok=function(p){return p&&typeof p.x==="number"&&typeof p.y==="number"&&
    typeof p.lat==="number"&&typeof p.lng==="number"&&
    isFinite(p.x)&&isFinite(p.y)&&isFinite(p.lat)&&isFinite(p.lng);};
  if(!ok(bm.p1)||!ok(bm.p2))return null;
  const dx=bm.p2.x-bm.p1.x,dy=bm.p2.y-bm.p1.y;
  if(Math.abs(dx)<0.08||Math.abs(dy)<0.08)return null;
  return {X1:wX(bm.p1.lng),Y1:wY(bm.p1.lat),x1:bm.p1.x,y1:bm.p1.y,
    sx:(wX(bm.p2.lng)-wX(bm.p1.lng))/dx,sy:(wY(bm.p2.lat)-wY(bm.p1.lat))/dy};
}
function bmToLatLng(bm,x,y){
  const c=bmSolve(bm);if(!c)return null;
  const wx=c.X1+(x-c.x1)*c.sx,wy=c.Y1+(y-c.y1)*c.sy;
  return {lat:y2lat(wy/TILE,ZREF),lng:x2lng(wx/TILE,ZREF)};
}
/* خريطة بغداد: صورة واحدة مُعايَرة بمقياس الرسم الأصلي (١٣٥٫٥ بكسل لكل كم)
   ومرتكزة على موضع اسم «بغداد». الضغط على الصورة يعطي موضعاً مطابقاً لها تماماً. */
const MAP_IMG={id:"baghdad",url:DEFAULT_BASEMAP_IMG,active:true,
  p1:{x:0.51679,y:0.43187,lat:33.3024,lng:44.3788},
  p2:{x:0.92,y:0.92,lat:33.271522,lng:44.456904}};
const MAP_ZMAX=16.5;
function activeBasemap(){return MAP_IMG;}
/* موضع إحداثي على الصورة (كسر من عرضها وارتفاعها) */
function imgFrac(lat,lng){
  const c=bmSolve(MAP_IMG);
  return {x:c.x1+(wX(lng)-c.X1)/c.sx,y:c.y1+(wY(lat)-c.Y1)/c.sy};
}
function onImage(lat,lng){
  const f=imgFrac(lat,lng);return f.x>=0&&f.x<=1&&f.y>=0&&f.y<=1;
}
/* أدنى تكبير: الصورة كلها داخل الإطار. التكبير الابتدائي: الصورة تملأ الإطار */
function mapLimits(){
  const s=mapSize(),c=bmSolve(MAP_IMG);
  const fitW=Math.log2(s.w/(c.sx/Math.pow(2,ZREF))),fitH=Math.log2(s.h/(c.sy/Math.pow(2,ZREF)));
  return {zmin:Math.min(fitW,fitH),zcover:Math.max(fitW,fitH),zmax:MAP_ZMAX};
}
/* يُبقي الصورة داخل الإطار: لا فراغ عند السحب، وتتوسّط إن كانت أصغر منه */
function clampView(){
  const s=mapSize();if(!s.w||!s.h)return;
  const L=mapLimits();
  MAPV.z=Math.max(L.zmin,Math.min(L.zmax,MAPV.z));
  const pl=bmPlacement(MAP_IMG);
  let dx=0,dy=0;
  if(pl.w<=s.w)dx=(s.w-pl.w)/2-pl.left;
  else if(pl.left>0)dx=-pl.left;
  else if(pl.left+pl.w<s.w)dx=s.w-(pl.left+pl.w);
  if(pl.h<=s.h)dy=(s.h-pl.h)/2-pl.top;
  else if(pl.top>0)dy=-pl.top;
  else if(pl.top+pl.h<s.h)dy=s.h-(pl.top+pl.h);
  if(dx||dy){const c=unproject(s.w/2-dx,s.h/2-dy);MAPV.lat=c.lat;MAPV.lng=c.lng;}
}
function fitImage(){
  const L=mapLimits();MAPV.z=L.zcover;
  const c=bmToLatLng(MAP_IMG,0.5,0.5);MAPV.lat=c.lat;MAPV.lng=c.lng;
  renderMap();
}
/* موضع الصورة داخل نافذة الخريطة عند التكبير الحالي */
function bmPlacement(bm){
  const c=bmSolve(bm);if(!c)return null;
  const k=Math.pow(2,MAPV.z-ZREF),tl=topLeftPx();
  const w=c.sx*k,h=c.sy*k;
  const left=(c.X1*k-c.x1*w)-tl.x, top=(c.Y1*k-c.y1*h)-tl.y;
  return {left:left,top:top,w:w,h:h};

(function mapEvents(){
  const host=$("#mapHost");
  const pts={};            /* أصابع/مؤشرات نشطة */
  let drag=null,moved=0,pinch=null,lastTap=0,lastTapXY=null,raf=0;
  const THRESH=5;
  function schedule(){if(raf)return;raf=requestAnimationFrame(function(){raf=0;renderMap();});}
  function localXY(e){const r=host.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
  function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
  function mid(a,b){return {x:(a.x+b.x)/2,y:(a.y+b.y)/2};}

  host.addEventListener("pointerdown",function(e){
    pts[e.pointerId]=localXY(e);
    const ids=Object.keys(pts);
    if(ids.length===2){
      const a=pts[ids[0]],b=pts[ids[1]];
      pinch={d:dist(a,b),acc:0};drag=null;host.classList.remove("drag");
    }else if(ids.length===1){
      drag={x:e.clientX,y:e.clientY,active:false};moved=0;
    }
  });
  host.addEventListener("pointermove",function(e){
    if(!(e.pointerId in pts))return;
    pts[e.pointerId]=localXY(e);
    const ids=Object.keys(pts);
    /* تكبير بإصبعين */
    if(pinch&&ids.length>=2){
      const a=pts[ids[0]],b=pts[ids[1]];
      const d=dist(a,b);
      if(pinch.d>0){
        const ratio=d/pinch.d;
        if(Math.abs(ratio-1)>0.02){
          const m=mid(a,b);
          zoomAt(Math.log2(ratio),m.x,m.y);
          pinch.d=d;
        }
      }
      return;
    }
    if(!drag)return;
    const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    moved+=Math.abs(dx)+Math.abs(dy);
    if(!drag.active){
      if(moved<THRESH)return;
      drag.active=true;host.classList.add("drag");
      if(host.setPointerCapture)try{host.setPointerCapture(e.pointerId);}catch(err){}
    }
    drag.x=e.clientX;drag.y=e.clientY;
    const tl=topLeftPx();
    const c=unproject(tl.w/2-dx,tl.h/2-dy);
    MAPV.lat=c.lat;MAPV.lng=c.lng;
    schedule();
  });
  function release(e){
    delete pts[e.pointerId];
    const ids=Object.keys(pts);
    if(ids.length<2)pinch=null;
    if(!ids.length){
      /* نقر مزدوج للتكبير */
      if(drag&&!drag.active){
        const p=localXY(e),now=Date.now();
        if(now-lastTap<320&&lastTapXY&&dist(p,lastTapXY)<34){
          zoomAt(1,p.x,p.y);lastTap=0;
        }else{lastTap=now;lastTapXY=p;}
      }
      drag=null;host.classList.remove("drag");
      renderMap();
    }
  }
  ["pointerup","pointercancel"].forEach(function(ev){host.addEventListener(ev,release);});
  host.addEventListener("pointerleave",function(e){
    if(pts[e.pointerId]){delete pts[e.pointerId];}
    if(!Object.keys(pts).length){drag=null;pinch=null;host.classList.remove("drag");}
  });
  host.addEventListener("click",function(e){
    if(moved>6)return;
    if(!pickMode)return;
    const p=localXY(e);
    const c=unproject(p.x,p.y);
    if(!onImage(c.lat,c.lng)){toast(t("offMap"));return;}
    pickMode.lat=c.lat;pickMode.lng=c.lng;
    renderMap();renderPickBar();
  });
  host.addEventListener("wheel",function(e){
    e.preventDefault();
    const p=localXY(e);
    zoomAt(e.deltaY<0?0.5:-0.5,p.x,p.y);},{passive:false});
})();
function zoomBy(d){
  const s=mapSize();zoomAt(d,s.w/2,s.h/2);
}
/* تكبير حول نقطة محددة: تبقى تلك النقطة الجغرافية تحت الإصبع */
function zoomAt(dz,px,py){
  const L=mapLimits();
  const nz=Math.max(L.zmin,Math.min(L.zmax,MAPV.z+dz));
  if(Math.abs(nz-MAPV.z)<1e-6)return;
  const geo=unproject(px,py);
  MAPV.z=nz;
  const s=mapSize();
  const gx=lng2x(geo.lng,nz)*TILE,gy=lat2y(geo.lat,nz)*TILE;
  MAPV.lng=x2lng((gx-px+s.w/2)/TILE,nz);
  MAPV.lat=y2lat((gy-py+s.h/2)/TILE,nz);
  renderMap();
}
/* ملاءمة العرض لكل النقاط والمتاجر المتاحة */
function fitToData(){
  const list=DB.points.filter(p=>(adminOn||p.status==="PUBLISHED")&&api.hasLoc(p))
    .concat(DB.stores.filter(api.hasLoc));
  if(!list.length){fitImage();return false;}
  let n=-90,so=90,w=180,e=-180;
  list.forEach(function(o){n=Math.max(n,o.lat);so=Math.min(so,o.lat);
    w=Math.min(w,o.lng);e=Math.max(e,o.lng);});
  const s=mapSize();
  const span=Math.max(Math.abs(e-w),Math.abs(n-so));
  let z;
  if(span<0.0005){
    z=14;                       /* نقطة واحدة أو نقاط متلاصقة: تكبير مريح يترك مجالاً */
  }else{
    for(z=16;z>10;z-=0.25){
      const dx=(lng2x(e,z)-lng2x(w,z))*TILE,dy=(lat2y(so,z)-lat2y(n,z))*TILE;
      if(dx<=s.w*0.75&&dy<=s.h*0.75)break;
    }
  }
  /* لا نتجاوز دقة الصورة كثيراً عند الملاءمة حتى لا تبدو ضبابية */
  MAPV.z=Math.min(z,13.9);MAPV.lat=(n+so)/2;MAPV.lng=(w+e)/2;renderMap();return true;
}

function priceShort(v){

  const nf=function(x,d){return new Intl.NumberFormat(LANG==="ar"?"ar-IQ":"en-US",{maximumFractionDigits:d}).format(x);};
  if(v>=1e6)return nf(v/1e6,2)+" "+t("million");

  return nf(v,0);
}
/* المقاس الظاهر في الدائرة: مقاسك المناسب إن وُجد، وإلا مدى المقاسات المتوفرة */
function circleInfo(p){
  const kind=kindOf(p),avail=(p.sizes||[]).filter(x=>left(p,x)>0);
  if(!avail.length)return {size:t("outOfStock"),warn:true};
  if(kind==="other"||(avail.length===1&&/^[—-]?$/.test(avail[0].s)))return {size:"",warn:false};
  const rec=recommendSize(p,PS.body);
  if(rec&&SEV[rec.fit.status]<2)return {size:rec.size.s,warn:false,mine:true};
  const lbl=avail.length>1?avail[0].s+"–"+avail[avail.length-1].s:avail[0].s;
  return {size:lbl,warn:!!rec};
}
function circleHtml(p,extra){
  const c=circleInfo(p);
  const pr=priceShort(unitPrice(p)),sz=c.size?(c.warn?"⚠ ":(c.mine?"✓ ":""))+c.size:"";
  const long=pr.length>7||sz.length>5;
  return '<span class="pcirc'+(c.warn?" warn":"")+(long?" long":"")+(extra?" "+extra:"")+'" title="'+esc(c.warn?t("notForYou"):"")+'">'+
    "<b>"+pr+"</b>"+(sz?"<small>"+esc(sz)+"</small>":"")+"</span>";
}

/* ==========================================================================
   الجولة: أسهم شفافة داخل الصورة
   أمام/خلف = التقدّم في نفس الاتجاه ثم الانتقال للنقطة التالية
   يمين/يسار = الالتفات إلى اتجاه آخر من نفس النقطة
   ========================================================================== */
const SV={pts:[],i:0,dir:"front",ph:0,street:null};
function openStreet(pointId){
  const p=DB.points.find(x=>x.id===pointId);if(!p)return;
  SV.street=DB.streets.find(s=>s.id===p.streetId)||null;
  SV.pts=api.pointsOfStreet(p.streetId,adminOn);
  SV.i=Math.max(0,SV.pts.findIndex(x=>x.id===pointId));
  SV.dir=api.availableDirs(SV.pts[SV.i])[0]||"front";
  SV.ph=0;
  DB.analytics.streetViews++;
  bump("streets",SV.street,"views");
  $("#ovStreet").classList.add("on");$("#ovStreet").setAttribute("aria-hidden","false");
  renderSV();
}
function closeStreet(){$("#ovStreet").classList.remove("on");$("#ovStreet").setAttribute("aria-hidden","true");}
$("#svBack").onclick=closeStreet;

/* التقدّم: الصورة التالية في نفس الاتجاه، وإلا النقطة التالية */
function findStep(dirStep){
  const p=SV.pts[SV.i],list=api.photos(p,SV.dir);
  const nextPh=SV.ph+dirStep;
  if(nextPh>=0&&nextPh<list.length)return {i:SV.i,dir:SV.dir,ph:nextPh};
  const pointStep=(SV.dir==="back")?-dirStep:dirStep;   /* النظر للخلف يعكس اتجاه المشي */
  const j=SV.i+pointStep;
  if(j<0||j>=SV.pts.length)return null;
  const q=SV.pts[j];
  const dir=api.photos(q,SV.dir).length?SV.dir:(api.availableDirs(q)[0]||null);
  if(!dir)return null;
  const ph=(dirStep>0)?0:Math.max(0,api.photos(q,dir).length-1);
  return {i:j,dir,ph};
}
function walk(dirStep){
  const s=findStep(dirStep);
  if(!s){toast(t("endOfWalk"));return;}
  SV.i=s.i;SV.dir=s.dir;SV.ph=s.ph;renderSV();
}
/* الالتفات: اتجاه آخر متاح في نفس النقطة */
function turn(delta){
  const p=SV.pts[SV.i],avail=api.availableDirs(p);
  if(avail.length<2)return;
  let idx=DIRS.indexOf(SV.dir);
  for(let k=1;k<=4;k++){
    const d=DIRS[((idx+delta*k)%4+4)%4];
    if(api.photos(p,d).length){SV.dir=d;SV.ph=0;renderSV();return;}
  }
}
function renderSV(){
  const p=SV.pts[SV.i];if(!p){closeStreet();return;}
  const list=api.photos(p,SV.dir);
  if(SV.ph>=list.length)SV.ph=Math.max(0,list.length-1);
  $("#svName").textContent=SV.street?SV.street.name:"";
  $("#svArea").textContent=[SV.street&&SV.street.areaName,SV.street&&SV.street.cityName]
    .filter(Boolean).join(" · ");
  const stage=$("#stage");
  if(list.length){
    const img=new Image();img.alt="";
    img.onload=function(){img.classList.add("show");
      setTimeout(function(){while(stage.children.length>1)stage.removeChild(stage.firstChild);},380);};
    img.src=list[SV.ph];
    stage.appendChild(img);
    if(img.complete)img.classList.add("show");
  }else{
    stage.innerHTML='<div style="display:grid;place-items:center;height:100%;color:#B5A88F;font-size:14px;padding:24px;text-align:center">'+t("noPhotoHere")+"</div>";
  }
  renderArrows();renderDirBar();renderNear();renderMini();preload();
  $("#seqline").innerHTML="<b>"+(SV.i+1)+"</b> / "+SV.pts.length+" · "+
    t(SV.dir)+" "+(SV.ph+1)+"/"+Math.max(1,list.length);
}
function renderArrows(){
  const box=$("#arrows");box.innerHTML="";
  const p=SV.pts[SV.i],avail=api.availableDirs(p);
  const mk=function(cls,glyph,label,fn,enabled){
    if(!enabled)return;
    const b=el("button","arrow "+cls,"<b>"+glyph+"</b><small>"+label+"</small>");
    b.onclick=fn;box.appendChild(b);
  };
  mk("fwd","▲",t(SV.dir),function(){walk(1);},!!findStep(1));
  mk("bwd","▼",t("back"),function(){walk(-1);},!!findStep(-1));
  const canTurn=avail.length>1;
  mk("lft","◀",t("left"),function(){turn(-1);},canTurn);
  mk("rgt","▶",t("right"),function(){turn(1);},canTurn);
}
function renderDirBar(){
  const bar=$("#dirbar");bar.innerHTML="";
  const p=SV.pts[SV.i];
  DIRS.forEach(function(d){
    const n=api.photos(p,d).length;
    const b=el("button",(SV.dir===d?"on":(n?"":"off")),t(d)+(n>1?" ("+n+")":""));
    b.onclick=function(){if(!n){toast(t("noPhotoHere"));return;}SV.dir=d;SV.ph=0;renderSV();};
    bar.appendChild(b);
  });
}
function preload(){
  [SV.i-1,SV.i,SV.i+1].forEach(function(j){
    const p=SV.pts[j];if(!p)return;
    DIRS.forEach(function(d){api.photos(p,d).slice(0,3).forEach(function(u){
      const im=new Image();im.src=u;});});
  });
}
/* خريطة مصغّرة: موقعك بين نقاط الشارع */
function renderMini(){
  const box=$("#svMini"),svg=box.querySelector("svg");
  const pts=SV.pts.filter(api.hasLoc);
  if(pts.length<1){box.classList.add("hide");return;}
  box.classList.remove("hide");
  let minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
  pts.forEach(function(p){minx=Math.min(minx,p.lng);maxx=Math.max(maxx,p.lng);
    miny=Math.min(miny,p.lat);maxy=Math.max(maxy,p.lat);});
  const one=pts.length<2;
  const px=function(v){return one?75:12+((v-minx)/((maxx-minx)||1))*126;};
  const py=function(v){return one?46:78-((v-miny)/((maxy-miny)||1))*62;};
  let g="";
  if(pts.length>1){
    g+='<path d="'+pts.map(function(p,i){return (i?"L":"M")+px(p.lng).toFixed(1)+" "+py(p.lat).toFixed(1);}).join(" ")+
       '" stroke="#3E9B5F" stroke-width="4" fill="none" stroke-linecap="round"/>';
  }
  const cur=SV.pts[SV.i];
  pts.forEach(function(p){
    const on=cur&&p.id===cur.id;
    g+='<circle cx="'+px(p.lng).toFixed(1)+'" cy="'+py(p.lat).toFixed(1)+'" r="'+(on?5:3)+
       '" fill="'+(on?"#C79A2E":"#3E9B5F")+'" stroke="#F6EFE3" stroke-width="'+(on?2:1)+'"/>';
  });
  /* سهم يوضّح اتجاه النظر */
  if(cur&&api.hasLoc(cur)){
    const ang={front:0,right:90,back:180,left:270}[SV.dir]||0;
    const cx=px(cur.lng),cy=py(cur.lat),r=11;
    const rad=(ang-90)*Math.PI/180;
    g+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+Math.cos(rad)*r).toFixed(1)+'" y2="'+
       (cy+Math.sin(rad)*r).toFixed(1)+'" stroke="#8C4A2F" stroke-width="2.5" stroke-linecap="round"/>';
  }
  svg.innerHTML=g;
  $("#svMiniLbl").textContent=t("miniMap");
}
function renderNear(){
  const p=SV.pts[SV.i],box=$("#svNear");box.innerHTML="";
  if(!api.hasLoc(p))return;
  api.nearby(p.lat,p.lng,150).slice(0,2).forEach(function(x){
    const c=catOf(x.store.categoryId);
    const b=el("button","nearcard","<span>"+(c?c.icon:"🏪")+"</span><h4>"+esc(x.store.name)+
      "</h4><span>"+x.d+" "+t("dist")+"</span>");
    b.onclick=function(){openStore(x.store.id);};box.appendChild(b);
  });
}
document.addEventListener("keydown",function(e){
  if($("#ovStreet").classList.contains("on")){
    if(e.key==="Escape")closeStreet();
    else if(e.key==="ArrowUp")walk(1);
    else if(e.key==="ArrowDown")walk(-1);
    else if(e.key==="ArrowRight")turn(1);
    else if(e.key==="ArrowLeft")turn(-1);
  }else if($("#ovStore").classList.contains("on")&&e.key==="Escape")closeStore();
  else if(e.key==="Escape")closeSheets();
});

function addToCart(goCk,force){
  const p=PS.p;

  if(!size){toast(t("pickSize"));return;}
  const s=p.sizes.find(x=>x.s===size);

  /* تحذير قبل الإضافة إن كان المقاس لا يناسب المجسّم */
  const e=fitEval(p,size,PS.body);

  if(f){if(f.qty>=left(p,s)){toast(t("outOfStock"));return;}f.qty++;}
  else CART.push({key:key,productId:p.id,size:size,color:color,qty:1});

/* حقل الموقع: خريطة أو GPS — بلا كتابة إحداثيات */
function locField(draft,label,reopen){
  const wrap=el("div");
  const head=el("div");head.style.cssText="font-size:12px;color:var(--muted);margin:6px 0";
  head.textContent=label;wrap.appendChild(head);
  const row=el("div","locrow");
  const state=el("span");
  const pick=el("button","btn sm ghost","🗺️ "+t("pickOnMap"));
  pick.onclick=function(){startPick(draft,reopen);};
  const gps=el("button","btn sm ghost","◎ "+t("useGps"));
  gps.onclick=function(){
    if(!navigator.geolocation){toast("GPS");return;}
    navigator.geolocation.getCurrentPosition(function(pos){
      draft.lat=pos.coords.latitude;draft.lng=pos.coords.longitude;paint();toast(t("locSet"));
    },function(){toast(t("locNone"));},{enableHighAccuracy:true,timeout:9000});
  };
  const clr=el("button","btn sm ghost",t("clearLoc"));
  clr.onclick=function(){draft.lat=null;draft.lng=null;paint();};
  function paint(){
    const has=api.hasLoc(draft);
    state.className=has?"locok":"";
    state.textContent=has?("✓ "+Number(draft.lat).toFixed(5)+", "+Number(draft.lng).toFixed(5)):t("locNone");
    clr.style.display=has?"":"none";
  }
  row.appendChild(pick);row.appendChild(gps);row.appendChild(clr);row.appendChild(state);
  wrap.appendChild(row);

  /* طريق ثالث يعمل حتى لو لم تظهر الخريطة: رابط OpenStreetMap أو إحداثيات */
  const pasteWrap=el("div");pasteWrap.style.marginTop="8px";
  const pl=el("div",null,t("pasteLoc"));
  pl.style.cssText="font-size:11.5px;color:var(--muted);margin-bottom:4px";
  const prow=el("div");prow.style.cssText="display:flex;gap:7px;align-items:center";
  const inp=el("input");inp.type="text";inp.id="locCoord";inp.placeholder=t("pasteHint");
  inp.style.cssText="flex:1;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--card);font-size:12.5px";
  const apply=el("button","btn sm gold",t("applyLoc"));
  apply.onclick=function(){
    const r=parseLocText(inp.value);
    if(!r){toast(t("pasteBad"));return;}
    draft.lat=r.lat;draft.lng=r.lng;
    if(r.z)MAPV.z=Math.max(3,Math.min(19,r.z));
    focusOn(r.lat,r.lng);paint();toast(t("pasteOk"));
  };
  inp.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();apply.onclick();}});
  prow.appendChild(inp);prow.appendChild(apply);
  pasteWrap.appendChild(pl);pasteWrap.appendChild(prow);
  wrap.appendChild(pasteWrap);
  paint();
  return wrap;
}

/* أندرويد قد يُغلق الصفحة حين تُفتح الكاميرا، فتضيع صور النقطة غير المحفوظة.
   نحفظ المسودة على الجهاز بعد كل تغيير ونستعيدها عند العودة. */
const CAP_KEY="vm_capture";
function capCount(d){return d&&d.dirs?DIRS.reduce(function(a,k){return a+((d.dirs[k]||[]).length);},0):0;}
function capLoad(){try{const v=JSON.parse(localStorage.getItem(CAP_KEY)||"null");return v&&v.streetId&&v.draft?v:null;}catch(e){return null;}}
function capSave(streetId,d){
  try{
    if(!capCount(d)&&d.lat==null){localStorage.removeItem(CAP_KEY);return;}
    localStorage.setItem(CAP_KEY,JSON.stringify({streetId:streetId,at:Date.now(),
      draft:{dirs:d.dirs,lat:d.lat,lng:d.lng}}));
  }catch(e){}
}
function capClear(){try{localStorage.removeItem(CAP_KEY);}catch(e){}hideResume();}
function hideResume(){const r=document.getElementById("resumeBar");if(r)r.remove();}
/* شريط «متابعة التصوير» عند فتح التطبيق إن وُجدت نقطة غير محفوظة */
function checkCaptureResume(){
  hideResume();
  if(!CLOUD.canEdit)return;
  const c=capLoad();if(!c)return;
  const st=DB.streets.find(x=>x.id===c.streetId);
  const n=capCount(c.draft);
  if(!st||!n)return;
  const bar=el("div","resumebar");bar.id="resumeBar";
  bar.innerHTML="<span>📷 "+t("capPending")+" «"+esc(st.name)+"» ("+n+" "+t("photosCount")+")</span>";
  const go1=el("button","btn sm gold",t("capResume"));
  go1.onclick=function(){hideResume();toggleAdmin(true);adminTab="streets";renderAdmin();pointForm(st);};
  const no=el("button","btn sm ghost",t("capDiscard"));
  no.onclick=function(){if(confirm(t("capDiscardQ")))capClear();};
  bar.appendChild(go1);bar.appendChild(no);document.body.appendChild(bar);
}
function pointForm(street,carry){
  let restored=false;
  if(!carry){const c=capLoad();if(c&&c.streetId===street.id&&(capCount(c.draft)||c.draft.lat!=null)){
    carry={dirs:Object.assign(emptyDirs(),c.draft.dirs||{}),lat:c.draft.lat,lng:c.draft.lng};restored=true;}}
  hideResume();
  const draft=carry||{dirs:emptyDirs(),lat:null,lng:null};
  if(!draft.dirs)draft.dirs=emptyDirs();
  /* لا نورّث إحداثيات النقطة السابقة حتى لا تتكدّس النقاط فوق بعضها،
     لكن نتمركز عندها على الخريطة ليكون التحديد أسرع */
  if(draft.lat==null){
    const prev=DB.points.filter(p=>p.streetId===street.id).sort((a,b)=>b.seq-a.seq)[0];
    if(prev&&api.hasLoc(prev))draft.nearLat=prev.lat,draft.nearLng=prev.lng;
  }
  const reopen=function(){go("admin");adminTab="streets";renderAdmin();pointForm(street,draft);};
  openForm(t("addPoint")+" — "+street.name,function(body){
    body.appendChild(locField(draft,t(REQUIRE_POINT_LOC?"locRequired":"locOptional"),reopen));
    const note=el("div");note.style.cssText="font-size:12px;color:var(--muted);margin:14px 0 8px";
    note.textContent=t("photosPerDir");
    body.appendChild(note);
    DIRS.forEach(function(d){body.appendChild(dirUploader(draft,d));});
    if(restored){
      toast(t("capRestored")+" ("+capCount(draft)+")");
      const rs=el("div","capnote","<span>↩ "+t("capRestored")+" — "+capCount(draft)+" "+t("photosCount")+"</span>");
      const x=el("button","mini d","🗑️ "+t("capDiscard"));
      x.onclick=function(){if(!confirm(t("capDiscardQ")))return;capClear();closeSheets();pointForm(street,{dirs:emptyDirs(),lat:null,lng:null});};
      rs.appendChild(x);body.insertBefore(rs,body.firstChild);
    }
    /* حفظ تلقائي ما دام النموذج مفتوحاً: بعد كل صورة أو تغيير موقع */
    let last="";
    const tick=setInterval(function(){
      if(!body.isConnected||!document.getElementById("shForm").classList.contains("on")){
        if(!body.isConnected)clearInterval(tick);return;}
      const now=JSON.stringify([draft.dirs,draft.lat,draft.lng]);
      if(now!==last){last=now;capSave(street.id,draft);}
    },700);
  },function(){
    const total=DIRS.reduce((a,d)=>a+draft.dirs[d].length,0);
    if(!total){toast(t("needPhoto"));return;}
    if(REQUIRE_POINT_LOC&&!api.hasLoc(draft)){toast(t("needLoc"));return;}
    api.addPoint(street.id,draft);capClear();
    closeSheets();toast(t(api.hasLoc(draft)?"pointSaved":"pointNoLoc"));renderAdmin();renderMap();
  });
}

/* لوحة المفاتيح على الجوال: نقيس المساحة الظاهرة فعلاً ونرفع النماذج فوقها،
   ثم نمرّر الحقل النشط إلى الوسط حتى يبقى ظاهراً أثناء الكتابة */
(function keyboardFix(){
  /* لوحة المفاتيح على الجوال: نرفع النماذج فوقها. لا نعتمد قياس الشاشة إلا إن كان معقولاً:
     داخل نافذة عرض لم تكتمل بعد قد يكون صفراً فتختفي كل النماذج بارتفاع صفر. */
  const vv=window.visualViewport,root=document.documentElement;
  function editing(){const a=document.activeElement;return !!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));}
  function clear(){root.style.removeProperty("--vvh");root.style.removeProperty("--kb");}
  function apply(){
    try{
      if(!vv){clear();return;}
      const h=vv.height,ih=window.innerHeight||0;
      if(!h||h<220||!ih||(vv.scale&&Math.abs(vv.scale-1)>0.02)){clear();return;}
      const kb=Math.max(0,ih-h-(vv.offsetTop||0));
      /* لوحة مفاتيح حقيقية فقط: حقل نشط ومساحة مغطاة معقولة */
      if(editing()&&kb>80&&kb<ih*0.7){
        root.style.setProperty("--vvh",Math.round(h)+"px");root.style.setProperty("--kb",Math.round(kb)+"px");
      }else clear();
    }catch(e){clear();}
  }
  if(vv){vv.addEventListener("resize",apply);vv.addEventListener("scroll",apply);}
  window.addEventListener("resize",apply);
  document.addEventListener("focusout",function(){setTimeout(apply,120);});
  clear();setTimeout(apply,400);
  document.addEventListener("focusin",function(e){
    const el2=e.target;
    if(!el2||!/^(INPUT|TEXTAREA|SELECT)$/.test(el2.tagName))return;
    setTimeout(apply,250);
    setTimeout(function(){try{el2.scrollIntoView({block:"center",behavior:"smooth"});}catch(err){}},320);
  });
})();

const NEUTRALS=new Set(["أسود","أبيض","رمادي","بيج","كحلي","كريمي","جملي","كاكي","بني","فضي",
  "black","white","gray","grey","beige","navy","cream","camel","khaki","brown","silver"]);
const COMPLEMENT={"أزرق":["برتقالي","جملي","بيج"],"برتقالي":["أزرق","كحلي"],"أحمر":["أخضر","كحلي"],"أخضر":["أحمر","عنابي","بيج"],

  "عنابي":["زيتي","بيج","كحلي"],"سماوي":["جملي","أبيض"],"ذهبي":["كحلي","أسود"],"خمري":["بيج","كحلي"]};
function haversine(a,b,c,d){const R=6371000,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r;
  const h=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return Math.round(2*R*Math.asin(Math.sqrt(h)));}
function norm(x){return String(x||"").toLowerCase().replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/[ًٌٍَُِّْـ]/g,"").trim();}
function matches(text,q){
  const words=norm(q).split(/\s+/).filter(w=>w.length>1&&!/^(ال)?(في|من|عن|على|الى|اين|اقرب|متجر|متاجر|يبيع|تبيع|اريد|ابحث|عن|لي|هل|يوجد|عندكم|شيء|ما|كم)$/.test(w));
  if(!words.length)return true;
  const tx=norm(text);
  return words.some(function(w){const ww=w.replace(/^ال/,"");return tx.indexOf(ww)>=0;});
}

function toolSearch(inp){
  inp=inp||{};const q=String(inp.query||""),kind=inp.kind?String(inp.kind):"",color=inp.color?String(inp.color):"";
  const maxP=Number(inp.max_price)||0,sid=inp.store_id?String(inp.store_id):"";
  let list=DB.products.filter(function(p){
    const st=DB.stores.find(x=>x.id===p.storeId);
    const cat=st?catOf(st.categoryId):null;
    const hay=[p.name,p.desc,(p.colors||[]).join(" "),st&&st.name,cat&&catName(cat),t(KINDS.find(k=>k[0]===kindOf(p))[1])].join(" ");
    if(q&&!matches(hay,q))return false;
    if(kind&&kindOf(p)!==kind)return false;
    if(color&&!(p.colors||[]).some(c=>norm(c).indexOf(norm(color))>=0))return false;
    if(maxP&&unitPrice(p)>maxP)return false;
    if(sid&&p.storeId!==sid)return false;
    return true;
  });
  return {count:list.length,products:list.slice(0,12).map(productBrief)};
}
function toolStores(inp){
  inp=inp||{};const q=String(inp.query||"");

  const rows=DB.stores.map(function(st){
    const prods=DB.products.filter(p=>p.storeId===st.id&&(!q||matches([p.name,p.desc,(p.colors||[]).join(" ")].join(" "),q)));
    const cat=catOf(st.categoryId);
    const storeMatch=!q||matches([st.name,cat&&catName(cat),st.streetName,st.areaName].join(" "),q);
    if(q&&!prods.length&&!storeMatch)return null;
    return {id:st.id,name:st.name,category:cat?catName(cat):"",street:st.streetName||"",area:st.areaName||"",
      has_location:api.hasLoc(st),
      distance_m:(here&&api.hasLoc(st))?haversine(here.lat,here.lng,st.lat,st.lng):null,
      matching_products:prods.slice(0,4).map(p=>({id:p.id,name:p.name,price:unitPrice(p)}))};
  }).filter(Boolean);
  rows.sort(function(a,b){
    if(a.distance_m!=null&&b.distance_m!=null)return a.distance_m-b.distance_m;
    if(a.distance_m!=null)return -1;if(b.distance_m!=null)return 1;
    return b.matching_products.length-a.matching_products.length;});
  return {user_location_known:!!here,stores:rows.slice(0,8)};
}

    neck_cm:bd.neck,shoe_eu:bd.foot,approx_top_size:top?top.size.s:null,approx_bottom_size:bot?bot.size.s:null,
    location_known:!!(AI.loc||userLoc)};
}
function toolColors(inp){
  const list=(inp&&Array.isArray(inp.colors)?inp.colors:[]).slice(0,12);
  const skin=SKINS[PS.body.skin]||SKINS[1];
  return {skin_hex:skin,colors:list.map(function(c){const h=colorHex(c),cs=colorSuit(h,skin);
    return {name:c,hex:h,neutral:NEUTRALS.has(String(c).trim())||NEUTRALS.has(String(c).trim().toLowerCase()),
      close_to_skin:cs?!cs.ok:null,complements:COMPLEMENT[String(c).trim()]||[]};})};
}
function aiTools(onStep){
  const w=function(label,fn){return function(inp){onStep(label);return fn(inp);};};
  return [
    {name:"search_products",description:"يبحث في منتجات المول الحقيقية. يُرجع حتى 12 منتجاً: id والاسم والمتجر والسعر بالدينار والألوان والمقاسات المتوفرة ومقاس المستخدم المناسب (my_size) وهل يناسبه. استخدمه لأي سؤال عن منتج أو سعر أو لون أو نوع.",
     inputSchema:{type:"object",properties:{query:{type:"string",description:"كلمات البحث بالعربية أو الإنجليزية"},
       kind:{type:"string",enum:["top","bottom","dress","shoes","other"]},color:{type:"string"},max_price:{type:"number"},store_id:{type:"string"}}},
     execute:w("🔍 "+t("aiSearching"),toolSearch)},
    {name:"find_stores",description:"يُرجع متاجر المول التي تبيع ما يطابق الطلب مرتبة من الأقرب لموقع المستخدم (distance_m بالمتر) إن كان موقعه معروفاً، مع أمثلة من منتجاتها. استخدمه لأسئلة: أين أجد، أقرب متجر يبيع، أي متجر.",
     inputSchema:{type:"object",properties:{query:{type:"string",description:"ما يبحث عنه المستخدم"}}},
     execute:w("📍 "+t("aiNearest"),toolStores)},
    {name:"my_purchases",description:"يُرجع ما اشتراه المستخدم وما في سلته: الاسم والنوع (top/bottom/dress/shoes) واللون المختار والمقاس والمتجر. استخدمه لتنسيق ألوان مشترياته أو اقتراح ما يكمّلها.",
     execute:w("🛍️ "+t("aiPurchases"),toolPurchases)},
    {name:"my_profile",description:"يُرجع قياسات مجسّم المستخدم (سم) وجنسه ولون بشرته ومقاساته التقريبية. استخدمه لأسئلة المقاس أو ملاءمة الألوان للبشرة.",
     execute:w("👤 "+t("aiProfile"),toolProfile)},
    {name:"color_match",description:"لقائمة أسماء ألوان يُرجع لكل لون: hex وهل هو محايد وهل هو قريب من لون بشرة المستخدم (فيبدو باهتاً) والألوان المكمّلة له. استخدمه قبل أي نصيحة تنسيق ألوان.",
     inputSchema:{type:"object",properties:{colors:{type:"array",items:{type:"string"}}},required:["colors"]},
     execute:w("🎨 "+t("aiColors"),toolColors)}];
}
function aiInstructions(){
  const cats=DB.categories.map(catName).join("، ");
  return "أنت «مساعدتي»، المساعد الذكي لتطبيق Virtual Mall في بغداد: مول افتراضي يتجوّل فيه الزبون في شوارع مصوّرة ويدخل المتاجر ويشتري. "+
    "أجب بلغة المستخدم (العربية افتراضياً) بأسلوب ودود ومختصر يناسب شاشة الهاتف: فقرات قصيرة أو نقاط تبدأ بـ «•»، بلا جداول ولا عناوين Markdown. "+
    "لكل ما يخص المنتجات والمتاجر والأسعار والمخزون والمقاسات والألوان والمشتريات استخدم الأدوات، ولا تخترع منتجاً أو متجراً أو سعراً غير موجود فيها. "+
    "عند ذكر منتج من نتائج الأدوات اكتب بعده رمزه هكذا [[p:ID]]، وعند ذكر متجر اكتب [[s:ID]] — ستتحول إلى بطاقات يضغط عليها المستخدم. "+
    "تنسيق الألوان: استخدم my_purchases ثم color_match، واقترح تشكيلات (علوي + سفلي + حذاء) مع السبب: لون مركزي واحد مع المحايدات، أو ألوان مكمّلة، وتجنّب الألوان القريبة من لون البشرة. "+
    "أقرب متجر: استخدم find_stores؛ إن لم يكن موقع المستخدم معروفاً فاذكر ذلك واقترح الضغط على زر «📍 موقعي». "+
    "المقاسات: اعتمد على my_profile وmy_size، وحذّر بوضوح إن كان المقاس غير مناسب. "+
    "يمكنك الإجابة عن الأسئلة العامة المناسبة باختصار، وارفض بلطف ما هو ضار أو غير لائق. "+
    "التصنيفات المتاحة: "+cats+". عدد المتاجر: "+DB.stores.length+"، المنتجات: "+DB.products.length+". العملة: الدينار العراقي.";
}
/* ===== الوضع الاحتياطي: قواعد محلية بلا ذكاء اصطناعي ===== */
function outfitAdvice(items){
  const skin=SKINS[PS.body.skin]||SKINS[1];
  const tops=items.filter(i=>i.kind==="top"||i.kind==="dress"),bots=items.filter(i=>i.kind==="bottom"),shoes=items.filter(i=>i.kind==="shoes");
  const neutral=function(c){return c&&(NEUTRALS.has(c)||NEUTRALS.has(String(c).toLowerCase()));};
  const close=function(c){const h=colorHex(c),cs=colorSuit(h,skin);return cs?!cs.ok:false;};
  const lines=[];
  items.forEach(function(i){if(i.color&&close(i.color))lines.push("• "+i.name+" ("+i.color+"): "+t("aiCloseSkin")+" [[p:"+i.id+"]]");});
  const combos=[];
  tops.forEach(function(a){(bots.length?bots:[null]).forEach(function(b){
    let sc=0;const ca=a.color,cb=b&&b.color;
    if(neutral(ca)||neutral(cb))sc+=2;
    if(ca&&cb&&!neutral(ca)&&!neutral(cb))sc+=((COMPLEMENT[ca]||[]).indexOf(cb)>=0)?1:-3;
    if(ca&&cb&&ca!==cb)sc+=1;
    if(ca&&close(ca))sc-=2;
    const sh=shoes.find(s=>neutral(s.color))||shoes[0]||null;
    combos.push({a:a,b:b,sh:sh,sc:sc});});});
  combos.sort((x,y)=>y.sc-x.sc);
  combos.slice(0,3).forEach(function(c,i){
    lines.push((i+1)+") "+c.a.name+(c.a.color?" ("+c.a.color+")":"")+(c.b?" + "+c.b.name+(c.b.color?" ("+c.b.color+")":""):"")+
      (c.sh?" + "+c.sh.name+(c.sh.color?" ("+c.sh.color+")":""):"")+" — "+(c.sc>=3?t("aiGreatMatch"):(c.sc>=1?t("aiGoodMatch"):t("aiRiskyMatch")))+
      " [[p:"+c.a.id+"]]"+(c.b?" [[p:"+c.b.id+"]]":""));});
  if(!combos.length&&items.length)items.forEach(function(i){
    const comp=COMPLEMENT[i.color]||[];
    lines.push("• "+i.name+(i.color?" ("+i.color+")":"")+": "+t("aiPairWith")+" "+(neutral(i.color)?t("aiAnyColor"):["أسود","أبيض","بيج"].concat(comp).join("، "))+" [[p:"+i.id+"]]");});
  return lines;
}
function aiLocal(q){
  const n=norm(q);
  if(/لون|الوان|تنسيق|نسق|مشتريات|اشتريت|ملابسي|اطقم|طقم/.test(n)){
    const items=purchasedItems();
    if(!items.length)return t("aiNoPurchases");
    return t("aiOutfitsIntro")+"\n"+outfitAdvice(items).join("\n");
  }
  if(/اقرب|قريب|اين|وين|متجر|محل|يبيع|تبيع/.test(n)){
    const r=toolStores({query:q});
    if(!r.stores.length)return t("aiNoStores");
    return (r.user_location_known?"":t("aiNeedLoc")+"\n")+r.stores.slice(0,5).map(function(s){
      return "• "+s.name+(s.distance_m!=null?" — "+(s.distance_m>=1000?(s.distance_m/1000).toFixed(1)+" "+t("km"):s.distance_m+" "+t("dist")):"")+
        (s.matching_products.length?" · "+s.matching_products.map(p=>p.name).join("، "):"")+" [[s:"+s.id+"]]";}).join("\n");
  }
  if(/مقاس|مقاسي|قياس|حجمي/.test(n)){
    const pr=toolProfile();
    return t("approxSize")+": 👕 "+(pr.approx_top_size||"—")+" · 👖 "+(pr.approx_bottom_size||"—")+" · 👟 "+pr.shoe_eu;
  }
  const r=toolSearch({query:q});
  if(!r.count)return t("aiNothing");
  return t("aiFound")+" "+r.count+":\n"+r.products.slice(0,6).map(function(p){
    return "• "+p.name+" — "+money(p.price)+(p.my_size?" · ✓ "+p.my_size:"")+" [[p:"+p.id+"]]";}).join("\n");
}
/* ===== الواجهة ===== */
function aiRender(){
  const box=$("#aiMsgs");box.innerHTML="";
  if(!AI.msgs.length){
    const w=el("div","aiwelcome","<b>✨ "+t("aiHello")+"</b><span>"+t("aiHelloSub")+"</span>");box.appendChild(w);
  }
  AI.msgs.forEach(function(m){
    const d=el("div","aimsg "+(m.role==="user"?"me":"bot"));
    d.innerHTML=aiFormat(m.content);
    d.querySelectorAll("[data-pid]").forEach(function(b){b.onclick=function(){openProduct(b.dataset.pid);};});
    d.querySelectorAll("[data-sid]").forEach(function(b){b.onclick=function(){closeSheets();openStore(b.dataset.sid);};});
    box.appendChild(d);
  });
  box.scrollTop=box.scrollHeight;
  $("#aiStop").classList.toggle("hide",!AI.busy);$("#aiSend").disabled=AI.busy;
  $("#aiLocBtn").classList.toggle("on",!!(AI.loc||userLoc));
}
function aiFormat(txt){
  let h=esc(txt||"");
  h=h.replace(/\[\[p:([\w-]+)\]\]/g,function(_,id){const p=DB.products.find(x=>x.id===id);
    return p?'<button class="aichip" data-pid="'+id+'">🏷️ '+esc(p.name)+" · "+priceShort(unitPrice(p))+"</button>":"";});
  h=h.replace(/\[\[s:([\w-]+)\]\]/g,function(_,id){const st=DB.stores.find(x=>x.id===id);
    return st?'<button class="aichip" data-sid="'+id+'">🏪 '+esc(st.name)+"</button>":"";});
  h=h.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\n/g,"<br>");
  return h;
}
function withTimeout(p,ms,val){
  return Promise.race([p,new Promise(function(r){setTimeout(function(){r(val);},ms);})]);
}
/* تُطلب الخدمة عند أول سؤال فقط. إن لم تستجب خلال ٨ ثوانٍ نعمل بالوضع المبسّط. */
function aiReady(){
  if(AI.checked)return Promise.resolve();
  AI.checked=true;AI.tools=true;
  if(!(window.claude&&window.claude.use))return Promise.resolve();
  let p;
  try{p=window.claude.use("sample");}catch(e){AI.sample=null;return Promise.resolve();}
  return withTimeout(Promise.resolve(p).catch(function(){return null;}),8000,null)
    .then(function(sm){AI.sample=(typeof sm==="function")?sm:null;});
}
function aiAsk(q){
  q=String(q||"").trim();if(!q||AI.busy)return;
  AI.msgs.push({role:"user",content:q});
  const bot={role:"assistant",content:"…"};AI.msgs.push(bot);
  AI.busy=true;aiRender();
  aiReady().then(function(){
    if(!AI.sample){bot.content=aiLocal(q)+"\n\n"+t("aiLocalNote");return;}
    AI.ctl=new AbortController();
    const turns=AI.msgs.slice(0,-1).slice(-12).map(function(m,i,arr){
      return {role:m.role,content:(i===0?aiInstructions()+"\n\n— سؤال المستخدم —\n":"")+m.content};});
    if(turns[0].role!=="user")turns.shift();
    let step="";
    const opts={signal:AI.ctl.signal,modelTier:"default",cache:false,
      onText:function(u){bot.content=u.text;aiRender();}};
    if(AI.tools)opts.tools=aiTools(function(lbl){step=lbl;if(bot.content==="…"||/^[🔍📍🛍️👤🎨]/.test(bot.content)){bot.content=lbl+"…";aiRender();}});
    /* الأدوات غير متاحة في هذا العرض؟ نعيد السؤال مرة واحدة بلا أدوات */
    const call=function(o){
      let pr;try{pr=AI.sample(turns,o);}catch(err){return Promise.reject({code:"upstream_error"});}
      return withTimeout(pr,150000,"__timeout").then(function(r){
        if(r==="__timeout"){try{AI.ctl.abort();}catch(err){}throw {code:"timeout"};}return r;});
    };
    return call(opts).catch(function(e){
        if(e&&e.code==="tools_unavailable"){AI.tools=false;delete opts.tools;return call(opts);}
        throw e;
      }).then(function(r){bot.content=(r&&r.text)||bot.content;})
      .catch(function(e){
        const c=e&&e.code;
        if(c==="cancelled"){bot.content=(e.text||"")+"\n"+t("aiStopped");return;}
        if(c==="not_granted"||c==="tools_unavailable"){AI.sample=c==="not_granted"?null:AI.sample;AI.tools=false;}
        bot.content=(e&&e.text?e.text+"\n\n":"")+aiLocal(q)+"\n\n"+(c==="rate_limited"?t("aiBusy"):t("aiLocalNote"));
      });
  }).then(function(){AI.busy=false;AI.ctl=null;aiRender();});
}
function openAI(){hideToast();
  aiRender();$("#shAI").classList.add("on");$("#shAI").setAttribute("aria-hidden","false");$("#scrim").classList.add("on");
}
(function aiWire(){
  $("#aiBtn").onclick=openAI;
  $("#aiClose").onclick=function(){closeSheets();};
  $("#aiSend").onclick=function(){const i=$("#aiInput");aiAsk(i.value);i.value="";};
  $("#aiInput").addEventListener("input",function(){const a=$("#aiInput");a.style.height="auto";a.style.height=Math.min(110,a.scrollHeight)+"px";});
  $("#aiInput").addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("#aiSend").click();}});
  $("#aiStop").onclick=function(){if(AI.ctl)AI.ctl.abort();};
  $("#aiClear").onclick=function(){if(AI.busy)return;AI.msgs=[];aiRender();};
  $("#aiLocBtn").onclick=function(){
    if(!navigator.geolocation){toast(t("locNone"));return;}
    navigator.geolocation.getCurrentPosition(function(pos){AI.loc={lat:pos.coords.latitude,lng:pos.coords.longitude};
      toast(t("locSet"));aiRender();},function(){toast(t("locNone"));},{enableHighAccuracy:true,timeout:9000});
  };
  document.querySelectorAll("#aiSugg button").forEach(function(b){b.onclick=function(){aiAsk(b.textContent.replace(/^\S+\s/,""));};});
})();

(function boot(){
  try{
    try{const f=JSON.parse(localStorage.getItem("vm_favs")||"[]");if(Array.isArray(f))FAVS=f;}catch(e){}
    buildNav();renderHome();renderChips();renderMap();syncCart();fixWidth();
    initCloud();
    setTimeout(function(){renderMap();fixWidth();},300);
    setTimeout(checkCaptureResume,1600);window.__vmBooted=true;document.documentElement.setAttribute("data-booted","1");
  }catch(err){
    const b=document.getElementById("bootfail");
    if(b){b.style.display="grid";document.getElementById("bootmsg").textContent=String(err&&err.message||err);}
  }
})();
